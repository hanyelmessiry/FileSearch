<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض والبحث في ملفات PDF</title>
    <!-- مكتبة PDF.js الرسمية لعرض صفحات PDF بالصور والنصوص -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 10px;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
        }
        h2 { 
            text-align: center; 
            color: #dc2626;
            margin: 0 0 10px 0;
            font-size: 19px;
            flex-shrink: 0;
        }
        .section { 
            margin-bottom: 10px; 
            flex-shrink: 0;
        }
        
        input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #f1f5f9;
            color: #334155;
            border: 1px dashed #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .custom-file-upload:hover {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }

        #searchInput { 
            width: 100%;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 20px;
            text-align: center;
        }

        .buttons-group {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        #nextMatchBtn {
            flex: 2;
            padding: 8px;
            background-color: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #toggleFileBtn {
            flex: 1;
            padding: 8px;
            background-color: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #nextMatchBtn:hover, #toggleFileBtn:hover {
            background-color: #e2e8f0;
        }

        #toggleFileBtn.active {
            background-color: #dc2626;
            color: white;
            border-color: #b91c1c;
        }

        .controls-toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 5px;
            background: #f8fafc;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        .nav-arrow-btn {
            background: #fff;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 15px;
            font-weight: bold;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .nav-arrow-btn:hover:not(:disabled) {
            background-color: #e2e8f0;
        }

        .toolbar-group {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .toolbar-group label {
            font-weight: bold;
            font-size: 11px;
            color: #334155;
            flex-shrink: 0;
        }

        select.toolbar-select {
            width: 100%;
            padding: 5px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 12px;
            font-family: inherit;
            background: #fff;
            cursor: pointer;
        }

        #nextMatchBtn:disabled, select:disabled, .nav-arrow-btn:disabled, #toggleFileBtn:disabled {
            background-color: #e2e8f0;
            cursor: not-allowed;
            color: #94a3b8;
        }

        input[type="text"]:disabled { background-color: #e2e8f0; cursor: not-allowed; }
        
        #resultsCount {
            margin-top: 4px;
            font-weight: bold;
            color: #dc2626;
            font-size: 13px;
            text-align: center;
        }

        .output-wrapper {
            display: flex;
            flex-direction: column;
            margin-top: 5px;
        }

        .output-container {
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            max-height: 55vh; 
            overflow-y: auto;
            overflow-x: auto; 
            background: #fafafa;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 15px;
            flex-wrap: wrap;
        }

        .pdf-page-container {
            position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            background: #fff;
            margin-bottom: 10px;
            direction: ltr;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s ease;
        }

        .pdf-page-container.selected-page {
            border-color: #dc2626 !important;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
        }

        .pdf-page-container canvas {
            display: block;
            max-width: 100%;
            height: auto !important;
        }

        .text-layer {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            opacity: 0.9;
            line-height: 1.0;
            pointer-events: none;
        }

        .text-layer > span {
            color: transparent;
            position: absolute;
            white-space: pre;
            cursor: text;
            transform-origin: 0% 0%;
        }

        mark {
            background-color: #fde047;
            color: #000;
            padding: 1px 2px;
            border-radius: 2px;
        }
        mark.current-match {
            background-color: #f97316 !important;
            color: #fff !important;
            outline: 2px solid #c2410c;
        }

        footer.page-footer {
            width: 100%;
            max-width: 900px;
            text-align: center;
            padding: 12px 0;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .footer-link {
            text-decoration: none;
            color: #dc2626;
            font-size: 13px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 6px;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            transition: all 0.2s ease;
        }

        .footer-link:hover {
            background-color: #fee2e2;
            color: #b91c1c;
            border-color: #fca5a5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 id="mainTitle">عارض وبحث ملفات PDF (نصوص وصور)</h2>

    <div class="section">
        <label for="fileInput" class="custom-file-upload" id="fileLabel">
            📑 اختر ملف PDF لعرضه والبحث فيه...
        </label>
        <input type="file" id="fileInput" accept=".pdf">
    </div>

    <div class="section">
        <label for="searchInput"><strong>ابحث عن كلمة داخل المستند:</strong></label>
        <input type="text" id="searchInput" placeholder="اكتب الكلمة للبحث وتلوينها..." disabled>
        
        <div class="buttons-group">
            <button id="nextMatchBtn" disabled>الانتقال للكلمة التالية 🔍</button>
            <button id="toggleFileBtn" disabled>📑 إخفاء الملف</button>
        </div>

        <div class="controls-toolbar">
            <button id="prevPageBtn" class="nav-arrow-btn" disabled title="المجموعة السابقة">◀</button>

            <div class="toolbar-group">
                <label for="zoomSelect">🔍 الحجم:</label>
                <select id="zoomSelect" class="toolbar-select" disabled>
                    <option value="0.25">25%</option>
                    <option value="0.5">50%</option>
                    <option value="0.75">75%</option>
                    <option value="1.0" selected>100%</option>
                    <option value="1.25">125%</option>
                    <option value="1.5">150%</option>
                </select>
            </div>

            <div class="toolbar-group">
                <label for="pagesPerRowSelect">📖 العرض:</label>
                <select id="pagesPerRowSelect" class="toolbar-select" disabled>
                    <option value="1" selected>صفحة واحدة</option>
                    <option value="2">صفحتين</option>
                    <option value="3">ثلاث صفحات</option>
                    <option value="all">جميع الصفحات</option>
                </select>
            </div>

            <button id="nextPageBtn" class="nav-arrow-btn" disabled title="المجموعة التالية">▶</button>
        </div>

        <div id="resultsCount"></div>
    </div>

    <div class="output-wrapper">
        <label style="display: block; margin-bottom: 4px; flex-shrink: 0;"><strong>محتوى الملف (انقر مرتين لفتح الملف):</strong></label>
        <div class="output-container" id="pdfViewer">
            <div style="color: #666; padding: 20px;">قم برفع ملف PDF لعرض صفحاته بكافة محتوياتها...</div>
        </div>
    </div>
</div>

<footer class="page-footer">
    <a href="index.html" class="footer-link">🏠 الصفحة الرئيسية</a>
    <a href="excel.html" class="footer-link">📊 جداول Excel</a>
    <a href="word.html" class="footer-link">📄 مستندات Word</a>
</footer>

<script>
    let pdfDoc = null;
    let isFileVisible = true;
    let currentScale = 1.0;
    let pagesPerRow = 1;
    let startIndex = 1;
    let selectedPageNum = null;
    let currentMatchIndex = -1;
    let currentFileBlobUrl = null;
    let originalFileName = "document.pdf";
    let searchKeyword = "";

    const fileInput = document.getElementById('fileInput');
    const fileLabel = document.getElementById('fileLabel');
    const searchInput = document.getElementById('searchInput');
    const nextMatchBtn = document.getElementById('nextMatchBtn');
    const toggleFileBtn = document.getElementById('toggleFileBtn');
    const zoomSelect = document.getElementById('zoomSelect');
    const pagesPerRowSelect = document.getElementById('pagesPerRowSelect');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');
    const pdfViewer = document.getElementById('pdfViewer');
    const resultsCount = document.getElementById('resultsCount');
    const mainTitle = document.getElementById('mainTitle');

    fileInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        originalFileName = file.name;
        fileLabel.textContent = `📑 ${file.name}`;
        mainTitle.textContent = `عرض ملف: ${file.name}`;
        pdfViewer.innerHTML = "<div style='color: #666; padding: 20px;'>جاري تحميل ورسم صفحات الـ PDF...</div>";

        if (currentFileBlobUrl) {
            URL.revokeObjectURL(currentFileBlobUrl);
        }
        currentFileBlobUrl = URL.createObjectURL(file);

        const reader = new FileReader();
        reader.onload = function(e) {
            const typedarray = new Uint8Array(e.target.result);

            pdfjsLib.getDocument(typedarray).promise.then(function(loadedPdf) {
                pdfDoc = loadedPdf;
                startIndex = 1;
                selectedPageNum = null;
                searchKeyword = "";
                searchInput.value = "";
                resetMatchesState();
                renderPdfGroup();

                searchInput.disabled = false;
                zoomSelect.disabled = false;
                pagesPerRowSelect.disabled = false;
                toggleFileBtn.disabled = false;
                
                isFileVisible = true;
                toggleFileBtn.textContent = "📑 إخفاء الملف";
                toggleFileBtn.classList.add('active');
                
                resultsCount.innerHTML = `تم تحميل المستند بنجاح (عدد الصفحات: ${pdfDoc.numPages})`;
            }).catch(function(error) {
                pdfViewer.innerHTML = "<div style='color: red; padding: 20px;'>حدث خطأ أثناء قراءة ملف الـ PDF!</div>";
                console.error(error);
            });
        };
        reader.readAsArrayBuffer(file);
    });

    function resetMatchesState() {
        currentMatchIndex = -1;
        nextMatchBtn.disabled = true;
    }

    function renderPdfGroup() {
        if (!pdfDoc) return;
        
        if (!isFileVisible) {
            pdfViewer.style.display = "none";
            return;
        }

        pdfViewer.style.display = "flex";
        pdfViewer.innerHTML = "";

        let start = startIndex;
        let end = pdfDoc.numPages;

        if (pagesPerRow !== 'all') {
            end = Math.min(startIndex + parseInt(pagesPerRow) - 1, pdfDoc.numPages);
        }

        let pagesRendered = 0;
        const totalToRender = (end - start) + 1;

        for (let i = start; i <= end; i++) {
            renderSinglePageToContainer(i, pdfViewer, function() {
                pagesRendered++;
                if (pagesRendered === totalToRender) {
                    restorePageFocus();
                }
            });
        }

        updatePaginationButtonsState();
    }

    function renderSinglePageToContainer(pageNum, container, callback) {
        pdfDoc.getPage(pageNum).then(function(page) {
            const viewport = page.getViewport({ scale: currentScale });

            const pageContainer = document.createElement('div');
            pageContainer.className = 'pdf-page-container';
            pageContainer.id = `page-container-${pageNum}`;
            if (pageNum === selectedPageNum) {
                pageContainer.classList.add('selected-page');
            }

            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            pageContainer.appendChild(canvas);

            const textLayerDiv = document.createElement('div');
            textLayerDiv.className = 'text-layer';
            pageContainer.appendChild(textLayerDiv);

            container.appendChild(pageContainer);

            pageContainer.addEventListener('click', function(e) {
                if (selectedPageNum === pageNum) {
                    selectedPageNum = null;
                    this.classList.remove('selected-page');
                } else {
                    document.querySelectorAll('.pdf-page-container').forEach(c => c.classList.remove('selected-page'));
                    this.classList.add('selected-page');
                    selectedPageNum = pageNum;
                    this.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
                }
            });

            pageContainer.addEventListener('dblclick', function(e) {
                e.preventDefault();
                if (currentFileBlobUrl) {
                    window.open(currentFileBlobUrl, '_blank');
                }
            });

            const renderContext = {
                canvasContext: context,
                viewport: viewport
            };

            page.render(renderContext);

            page.getTextContent().then(function(textContent) {
                pdfjsLib.renderTextLayer({
                    textContent: textContent,
                    container: textLayerDiv,
                    viewport: viewport,
                    textDivs: []
                }).promise.then(() => {
                    if (searchKeyword !== "") {
                        highlightTextInLayer(textLayerDiv, searchKeyword);
                    }
                    if (callback) callback();
                });
            });
        });
    }

    function highlightTextInLayer(textLayerElement, keyword) {
        const textSpans = textLayerElement.querySelectorAll('span');
        const escapedKeyword = keyword.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        const regex = new RegExp(`(${escapedKeyword})`, 'gi');

        textSpans.forEach(span => {
            if (span.textContent && regex.test(span.textContent)) {
                span.innerHTML = span.textContent.replace(regex, '<mark>$1</mark>');
            }
        });
    }

    function restorePageFocus() {
        if (selectedPageNum !== null) {
            const targetContainer = document.getElementById(`page-container-${selectedPageNum}`);
            if (targetContainer) {
                targetContainer.classList.add('selected-page');
                targetContainer.scrollIntoView({ behavior: 'auto', block: 'center', inline: 'center' });
            }
        }
    }

    nextMatchBtn.addEventListener('click', function() {
        if (!isFileVisible) {
            toggleFileBtn.click();
        }

        const marks = Array.from(pdfViewer.querySelectorAll('mark'));
        if (marks.length === 0) return;

        if (currentMatchIndex >= 0 && currentMatchIndex < marks.length) {
            marks[currentMatchIndex].classList.remove('current-match');
        }

        currentMatchIndex = (currentMatchIndex + 1) % marks.length;
        const activeMark = marks[currentMatchIndex];
        activeMark.classList.add('current-match');

        const parentPageContainer = activeMark.closest('.pdf-page-container');
        if (parentPageContainer) {
            document.querySelectorAll('.pdf-page-container').forEach(c => c.classList.remove('selected-page'));
            parentPageContainer.classList.add('selected-page');
            selectedPageNum = parseInt(parentPageContainer.id.replace('page-container-', ''));
            activeMark.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
        }
    });

    prevPageBtn.addEventListener('click', function() {
        if (pagesPerRow !== 'all' && startIndex > 1) {
            startIndex = Math.max(1, startIndex - parseInt(pagesPerRow));
            renderPdfGroup();
        }
    });

    nextPageBtn.addEventListener('click', function() {
        if (pagesPerRow !== 'all' && pdfDoc && startIndex + parseInt(pagesPerRow) <= pdfDoc.numPages) {
            startIndex += parseInt(pagesPerRow);
            renderPdfGroup();
        }
    });

    function updatePaginationButtonsState() {
        if (pagesPerRow === 'all' || !isFileVisible) {
            prevPageBtn.disabled = true;
            nextPageBtn.disabled = true;
        } else {
            prevPageBtn.disabled = startIndex <= 1;
            nextPageBtn.disabled = !pdfDoc || startIndex + parseInt(pagesPerRow) > pdfDoc.numPages;
        }
    }

    zoomSelect.addEventListener('change', function() {
        currentScale = parseFloat(this.value);
        renderPdfGroup();
    });

    pagesPerRowSelect.addEventListener('change', function() {
        pagesPerRow = this.value;
        if (pagesPerRow === 'all') {
            startIndex = 1;
        } else if (selectedPageNum !== null) {
            startIndex = Math.floor((selectedPageNum - 1) / parseInt(pagesPerRow)) * parseInt(pagesPerRow) + 1;
        } else {
            startIndex = 1;
        }
        renderPdfGroup();
    });

    toggleFileBtn.addEventListener('click', function() {
        if (!pdfDoc) return;

        if (isFileVisible) {
            isFileVisible = false;
            toggleFileBtn.textContent = "📑 إظهار الملف";
            toggleFileBtn.classList.remove('active');
            pdfViewer.style.display = "none";
            updatePaginationButtonsState();
        } else {
            isFileVisible = true;
            toggleFileBtn.textContent = "📑 إخفاء الملف";
            toggleFileBtn.classList.add('active');
            pdfViewer.style.display = "flex";
            renderPdfGroup();
        }
    });

    // البحث المستقل عن العرض لضمان ظهور النتائج وحسابها حتى لو كان الملف مخفياً
    searchInput.addEventListener('input', async function() {
        searchKeyword = searchInput.value.trim().toLowerCase();
        if (!pdfDoc) return;

        if (searchKeyword === "") {
            resultsCount.innerHTML = `تم عرض الملف كاملاً (عدد الصفحات: ${pdfDoc.numPages})`;
            resetMatchesState();
            renderPdfGroup();
            return;
        }

        let matchedPagesCount = 0;
        let firstMatchPage = null;

        for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
            const page = await pdfDoc.getPage(pageNum);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str).join(" ").toLowerCase();

            if (pageText.includes(searchKeyword)) {
                if (firstMatchPage === null) {
                    firstMatchPage = pageNum;
                }
                matchedPagesCount++;
            }
        }

        if (matchedPagesCount > 0 && firstMatchPage !== null) {
            if (pagesPerRow !== 'all') {
                startIndex = Math.floor((firstMatchPage - 1) / parseInt(pagesPerRow)) * parseInt(pagesPerRow) + 1;
            }
            selectedPageNum = firstMatchPage;
            
            renderPdfGroup();
            nextMatchBtn.disabled = false;

            setTimeout(() => {
                const marks = pdfViewer.querySelectorAll('mark');
                if (marks.length > 0) {
                    currentMatchIndex = 0;
                    marks[0].classList.add('current-match');
                    resultsCount.innerHTML = `عدد الكلمات المطابقة: ${marks.length} في ${matchedPagesCount} صفحة.`;
                } else {
                    resultsCount.innerHTML = `تم العثور على الكلمة في ${matchedPagesCount} صفحة.`;
                }
            }, 400);
        } else {
            resultsCount.innerHTML = "لم يتم العثور على أي نتائج تطابق البحث في المستند.";
            resetMatchesState();
        }
    });
</script>

</body>
</html>
