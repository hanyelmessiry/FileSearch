<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البحث والتعديل المباشر في ملف Excel</title>
    <!-- مكتبة SheetJS لقراءة وتعديل وتصدير ملفات Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 10px;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 850px;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
        }
        h2 { 
            text-align: center; 
            color: #16a34a;
            margin: 0 0 10px 0;
            font-size: 19px;
            flex-shrink: 0;
        }
        .section { 
            margin-bottom: 10px; 
            flex-shrink: 0;
        }
        
        input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #f1f5f9;
            color: #334155;
            border: 1px dashed #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .custom-file-upload:hover {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }

        #searchInput { 
            width: 100%;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 20px;
            text-align: center;
        }

        #toggleFileBtn, #nextMatchBtn {
            width: 100%;
            margin-top: 5px;
            padding: 8px;
            background-color: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #toggleFileBtn:hover, #nextMatchBtn:hover {
            background-color: #e2e8f0;
        }

        #toggleFileBtn.active {
            background-color: #16a34a;
            color: white;
            border-color: #15803d;
        }

        /* أزرار الحفظ والتنزيل دائمة الظهور بنسبة 3:1 */
        .save-download-group {
            display: flex;
            gap: 5px;
            margin-top: 5px;
            width: 100%;
        }

        #saveChangesBtn {
            flex: 3;
            padding: 8px;
            background-color: #16a34a;
            color: white;
            border: 1px solid #15803d;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #saveChangesBtn:hover {
            background-color: #15803d;
        }

        #downloadFileBtn {
            flex: 1;
            padding: 8px;
            background-color: #0d9488;
            color: white;
            border: 1px solid #0f766e;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #downloadFileBtn:hover {
            background-color: #0f766e;
        }

        #toggleFileBtn:disabled, #nextMatchBtn:disabled {
            background-color: #e2e8f0;
            cursor: not-allowed;
            color: #94a3b8;
        }

        input[type="text"]:disabled { background-color: #e2e8f0; cursor: not-allowed; }
        
        #resultsCount {
            margin-top: 4px;
            font-weight: bold;
            color: #16a34a;
            font-size: 13px;
        }

        .output-wrapper {
            display: flex;
            flex-direction: column;
            margin-top: 5px;
        }

        .output-container {
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            max-height: 45vh; 
            overflow-y: auto;
            overflow-x: auto; 
            background: #fafafa;
        }

        #output {
            padding: 15px;
            line-height: 1.5;
        }

        table.excel-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            margin-bottom: 15px;
            background: #fff;
            font-size: 13px;
        }

        table.excel-table th, table.excel-table td {
            border: 1px solid #cbd5e1;
            padding: 8px 10px;
            text-align: right;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
            cursor: pointer;
        }

        table.excel-table th {
            background-color: #f1f5f9;
            color: #1e293b;
            font-weight: bold;
        }

        table.excel-table tbody tr:hover {
            background-color: #fef08a !important;
        }

        table.excel-table td.expanded, table.excel-table th.expanded {
            white-space: normal !important;
            word-break: break-word !important;
            overflow: visible !important;
            position: relative;
            z-index: 20;
            background-color: #fff !important;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        table.excel-table td input.cell-input {
            width: 100%;
            border: none;
            background: #e0f2fe;
            font-family: inherit;
            font-size: inherit;
            text-align: inherit;
            padding: 2px;
            outline: 2px solid #2563eb;
            border-radius: 3px;
            white-space: normal;
            overflow: visible;
            cursor: text;
            z-index: 25;
            position: relative;
        }

        .excel-sheet-title {
            font-weight: bold;
            color: #16a34a;
            margin: 15px 0 8px 0;
            font-size: 15px;
            border-bottom: 2px solid #16a34a;
            padding-bottom: 4px;
        }

        /* تنسيق الكلمات المطابقة وتحديد الكلمة النشطة */
        mark {
            background-color: #fde047;
            color: #000;
            padding: 2px 4px;
            border-radius: 3px;
        }
        mark.current-match {
            background-color: #f97316 !important;
            color: #fff !important;
            outline: 2px solid #c2410c;
        }

        footer.page-footer {
            width: 100%;
            max-width: 850px;
            text-align: center;
            padding: 12px 0;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .footer-link {
            text-decoration: none;
            color: #16a34a;
            font-size: 13px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 6px;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            transition: all 0.2s ease;
        }

        .footer-link:hover {
            background-color: #dcfce7;
            color: #15803d;
            border-color: #86efac;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 id="mainTitle">البحث والتعديل المباشر في ملف Excel</h2>

    <div class="section">
        <label for="fileInput" class="custom-file-upload" id="fileLabel">
            📊 اختر ملف Excel للبحث والتعديل...
        </label>
        <input type="file" id="fileInput" accept=".xlsx, .xls">
    </div>

    <div class="section">
        <label for="searchInput"><strong>ابحث عن كلمة في كافة الأعمدة:</strong></label>
        <input type="text" id="searchInput" placeholder="اكتب الكلمة للبحث وتلوينها..." disabled>
        
        <button id="toggleFileBtn" disabled>📊 إخفاء الملف</button>

        <div class="save-download-group" id="saveDownloadGroup" style="display:none;">
            <button id="saveChangesBtn">💾 حفظ التعديلات</button>
            <button id="downloadFileBtn">📥 تنزيل</button>
        </div>

        <button id="nextMatchBtn" disabled>الانتقال للكلمة التالية 🔍</button>

        <div id="resultsCount"></div>
    </div>

    <div class="output-wrapper">
        <label style="display: block; margin-bottom: 4px; flex-shrink: 0;"><strong>محتوى الملف / النتائج:</strong></label>
        <div class="output-container">
            <div id="output">قم برفع الملف ثم ابحث، نقرة واحدة لإظهار النص، ونقرتين لتعديل الخلية مباشرة...</div>
        </div>
    </div>
</div>

<footer class="page-footer">
    <a href="index.html" class="footer-link">🏠 الصفحة الرئيسية</a>
    <a href="word.html" class="footer-link">📄 مستندات Word</a>
    <a href="pdf.html" class="footer-link">📑 ملفات PDF</a>
</footer>

<script>
    let workbookData = [];
    let isFileVisible = true;
    let currentMatchIndex = -1;
    let originalFileName = "data.xlsx";

    const fileInput = document.getElementById('fileInput');
    const fileLabel = document.getElementById('fileLabel');
    const searchInput = document.getElementById('searchInput');
    const toggleFileBtn = document.getElementById('toggleFileBtn');
    const saveDownloadGroup = document.getElementById('saveDownloadGroup');
    const saveChangesBtn = document.getElementById('saveChangesBtn');
    const downloadFileBtn = document.getElementById('downloadFileBtn');
    const nextMatchBtn = document.getElementById('nextMatchBtn');
    const outputDiv = document.getElementById('output');
    const resultsCount = document.getElementById('resultsCount');
    const mainTitle = document.getElementById('mainTitle');

    fileInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        originalFileName = file.name;
        fileLabel.textContent = `📊 ${file.name}`;
        mainTitle.textContent = `البحث والتعديل المباشر داخل ${file.name}`;
        outputDiv.innerHTML = "جاري قراءة ملف الإكسيل وتحويل البيانات...";

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });

            workbookData = [];
            workbook.SheetNames.forEach(sheetName => {
                const worksheet = workbook.Sheets[sheetName];
                const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                workbookData.push({
                    name: sheetName,
                    rows: jsonRows
                });
            });

            renderTables();

            searchInput.disabled = false;
            toggleFileBtn.disabled = false;
            saveDownloadGroup.style.display = "flex";
            
            isFileVisible = true;
            toggleFileBtn.textContent = "📊 إخفاء الملف";
            toggleFileBtn.classList.add('active');
            
            resultsCount.innerHTML = "تم عرض ملف الإكسيل كاملاً وجاهز للبحث والتعديل الفوري.";
            resetMatchesState();
        };
        reader.readAsArrayBuffer(file);
    });

    function attachCellInteractions() {
        const cells = outputDiv.querySelectorAll('table.excel-table td');
        cells.forEach(cell => {
            cell.addEventListener('click', function(e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'MARK') return;
                this.classList.toggle('expanded');
            });

            cell.addEventListener('dblclick', function(e) {
                if (e.target.tagName === 'INPUT') return;
                const sheetIdx = this.getAttribute('data-sheet');
                const rowIdx = this.getAttribute('data-row');
                const colIdx = this.getAttribute('data-col');
                const currentValue = workbookData[sheetIdx].rows[rowIdx][colIdx] ?? "";

                this.innerHTML = `<input type="text" class="cell-input" value="${currentValue}" data-sheet="${sheetIdx}" data-row="${rowIdx}" data-col="${colIdx}">`;
                
                const inputField = this.querySelector('input.cell-input');
                inputField.focus();

                inputField.addEventListener('input', function() {
                    workbookData[sheetIdx].rows[rowIdx][colIdx] = this.value;
                });

                inputField.addEventListener('blur', function() {
                    workbookData[sheetIdx].rows[rowIdx][colIdx] = this.value;
                    renderTables(searchInput.value.trim());
                });
            });
        });
    }

    // دالة لتبريز وتلوين الكلمات المطابقة للبحث داخل الخلايا
    function highlightText(text, keyword) {
        if (!keyword) return text !== undefined && text !== null ? text : "";
        const stringVal = text !== undefined && text !== null ? String(text) : "";
        const escapedKeyword = keyword.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        const regex = new RegExp(`(${escapedKeyword})`, 'gi');
        return stringVal.replace(regex, '<mark>$1</mark>');
    }

    function renderTables(filterKeyword = "") {
        if (workbookData.length === 0) return;

        // إذا كان الملف مخفياً، نقوم فقط بحساب النتائج وتحديث العد دون إعادة رسم الجداول
        const keyword = filterKeyword.toLowerCase().trim();
        let totalMatches = 0;

        workbookData.forEach(sheet => {
            sheet.rows.forEach((row, rowIndex) => {
                if (rowIndex === 0) return;
                const rowString = row.join(" ").toLowerCase();
                if (keyword === "" || rowString.includes(keyword)) {
                    if (keyword !== "") totalMatches++;
                }
            });
        });

        if (!isFileVisible) {
            if (keyword !== "") {
                resultsCount.innerHTML = `عدد الصفوف المطابقة للبحث: ${totalMatches}`;
                nextMatchBtn.disabled = totalMatches === 0;
            } else {
                resultsCount.innerHTML = "تم إخفاء عرض الملف. (نتائج البحث جاهزة)";
                resetMatchesState();
            }
            return;
        }

        let htmlContainer = "";
        let renderedMatchesCount = 0;

        workbookData.forEach((sheet, sheetIndex) => {
            let sheetRowsHtml = "";
            let hasMatchInSheet = false;

            sheet.rows.forEach((row, rowIndex) => {
                if (rowIndex === 0) {
                    let headerHtml = "<tr>";
                    row.forEach(cell => {
                        headerHtml += `<th>${cell !== undefined && cell !== null ? cell : ""}</th>`;
                    });
                    headerHtml += "</tr>";
                    sheetRowsHtml += headerHtml;
                    return;
                }

                const rowString = row.join(" ").toLowerCase();
                const isMatch = keyword === "" || rowString.includes(keyword);

                if (isMatch) {
                    if (keyword !== "") renderedMatchesCount++;
                    hasMatchInSheet = true;

                    let rowHtml = "<tr>";
                    row.forEach((cellValue, colIndex) => {
                        const highlightedValue = highlightText(cellValue, keyword);
                        rowHtml += `<td data-sheet="${sheetIndex}" data-row="${rowIndex}" data-col="${colIndex}">${highlightedValue}</td>`;
                    });
                    rowHtml += "</tr>";
                    sheetRowsHtml += rowHtml;
                }
            });

            if (keyword === "" || hasMatchInSheet) {
                htmlContainer += `<div class="excel-sheet-title">📄 ورقة: ${sheet.name}</div>`;
                htmlContainer += `<table class="excel-table">${sheetRowsHtml}</table>`;
            }
        });

        if (workbookData.length > 0 && htmlContainer === "") {
            outputDiv.innerHTML = "<div style='color: #666; padding: 10px;'>لم يتم العثور على أي نتائج تطابق البحث.</div>";
            resultsCount.innerHTML = "عدد النتائج: 0";
            nextMatchBtn.disabled = true;
            return;
        }

        outputDiv.innerHTML = htmlContainer;
        attachCellInteractions();

        if (keyword !== "") {
            resultsCount.innerHTML = `عدد الصفوف المطابقة للبحث: ${renderedMatchesCount}`;
            nextMatchBtn.disabled = false;
        } else {
            resultsCount.innerHTML = "تم عرض ملف الإكسيل كاملاً وجاهز للبحث والتعديل الفوري.";
            resetMatchesState();
        }
    }

    // البحث يعمل لحظياً حتى عندما يكون الملف مخفياً
    searchInput.addEventListener('input', function() {
        const keyword = searchInput.value.trim();
        renderTables(keyword);
    });

    toggleFileBtn.addEventListener('click', function() {
        if (workbookData.length === 0) return;

        if (isFileVisible) {
            isFileVisible = false;
            toggleFileBtn.textContent = "📊 إظهار الملف";
            toggleFileBtn.classList.remove('active');
            outputDiv.innerHTML = "<div style='color: #666;'>تم إخفاء عرض الملف. (يمكنك البحث وستظهر النتائج هنا)</div>";
            renderTables(searchInput.value.trim()); // تحديث نتائج العد أثناء الإخفاء
        } else {
            isFileVisible = true;
            toggleFileBtn.textContent = "📊 إخفاء الملف";
            toggleFileBtn.classList.add('active');
            renderTables(searchInput.value.trim());
        }
    });

    saveChangesBtn.addEventListener('click', function() {
        resultsCount.innerHTML = "✅ تم حفظ التعديلات في ذاكرة التطبيق بنجاح!";
    });

    downloadFileBtn.addEventListener('click', function() {
        const newWorkbook = XLSX.utils.book_new();
        workbookData.forEach(sheet => {
            const worksheet = XLSX.utils.aoa_to_sheet(sheet.rows);
            XLSX.utils.book_append_sheet(newWorkbook, worksheet, sheet.name);
        });

        let nameParts = originalFileName.split('.');
        if (nameParts.length > 1) nameParts.pop();
        const newFileName = `معدل_${nameParts.join('.')}.xlsx`;

        XLSX.writeFile(newWorkbook, newFileName);
        resultsCount.innerHTML = "📥 تم تنزيل الملف المعدل كـ Excel (.xlsx) بنجاح!";
    });

    function resetMatchesState() {
        currentMatchIndex = -1;
        nextMatchBtn.disabled = true;
    }

    nextMatchBtn.addEventListener('click', function() {
        // إذا كان الملف مخفياً، نقوم بإظهاره تلقائياً عند الرغبة بالانتقال للنتيجة التالية
        if (!isFileVisible) {
            toggleFileBtn.click();
        }

        const marks = Array.from(outputDiv.querySelectorAll('mark'));
        if (marks.length === 0) return;

        if (currentMatchIndex >= 0 && currentMatchIndex < marks.length) {
            marks[currentMatchIndex].classList.remove('current-match');
        }

        currentMatchIndex = (currentMatchIndex + 1) % marks.length;
        const activeMark = marks[currentMatchIndex];
        activeMark.classList.add('current-match');

        const parentCell = activeMark.closest('td');
        if (parentCell) {
            parentCell.classList.add('expanded');
            parentCell.scrollIntoView({
                behavior: 'smooth',
                block: 'center'
            });
        }
    });
</script>

</body>
</html>
